<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390">

  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .sec-label { font-size: 12.5px; font-weight: 700; fill: #334155; }
      .math { font-size: 15.5px; font-weight: 700; }
      .math-sm { font-size: 13px; font-weight: 700; }
      .sub { font-size: 10px; font-weight: 700; }
      .sub-sm { font-size: 8.8px; font-weight: 700; }
      .tiny { font-size: 10px; fill: #64748B; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-red-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-red-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F87171"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="390" fill="#FFFFFF"/>

  <!-- Cell dashed boundary -->
  <rect x="132" y="34" width="496" height="292" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="150" y="56" class="tiny" style="font-weight:700; letter-spacing:0.5px;">CÉLULA GRU (t)</text>

  <!-- External nodes -->
  <rect x="23.0" y="68.0" width="74" height="40" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="60.0" y="93.4" text-anchor="middle" style="font-size:15.5px; font-weight:700;" fill="#5B21B6">h<tspan dy="3.5" class="sub">t−1</tspan></text>
  <rect x="659.0" y="68.0" width="74" height="40" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="696.0" y="93.4" text-anchor="middle" style="font-size:15.5px; font-weight:700;" fill="#5B21B6">h<tspan dy="3.5" class="sub">t</tspan></text>
  <rect x="172.0" y="342.0" width="72" height="36" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="208.0" y="365.4" text-anchor="middle" style="font-size:15.5px; font-weight:700;" fill="#1D4ED8">x<tspan dy="3.5" class="sub">t</tspan></text>

  <!-- ================= TOP MEMORY HIGHWAY ================= -->
  <line x1="97" y1="88" x2="257" y2="88" stroke="#7C3AED" stroke-width="2.8" marker-end="url(#arr-purple)"/>
  <line x1="291" y1="88" x2="529" y2="88" stroke="#7C3AED" stroke-width="2.8" marker-end="url(#arr-purple)"/>
  <line x1="563" y1="88" x2="653" y2="88" stroke="#7C3AED" stroke-width="2.8" marker-end="url(#arr-purple)"/>

  <!-- ================= BOTTOM BUSES (h_(t-1) purple, x_t blue) ================= -->
  <!-- h_(t-1) drops from (174, y_h) to y_bus_h and runs to x_rmul -->
  <circle cx="174" cy="88" r="4.5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 174 92.5 L 174 286 L 454 286" fill="none" stroke="#7C3AED" stroke-width="2.1"/>
  <!-- h_(t-1) vertical taps into z_t, r_t, and r_mul -->
  <line x1="269" y1="286" x2="269" y2="263" stroke="#7C3AED" stroke-width="1.9" marker-end="url(#arr-purple)"/>
  <line x1="375" y1="286" x2="375" y2="263" stroke="#7C3AED" stroke-width="1.9" marker-end="url(#arr-purple)"/>
  <line x1="454" y1="286" x2="454" y2="261" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- x_t enters at (208, 342) -> y_bus_x -> runs right to x_cand -->
  <path d="M 208 342 L 208 304 L 548 304" fill="none" stroke="#2563EB" stroke-width="2.1"/>
  <!-- x_t vertical taps into z_t, r_t, and tanh -->
  <line x1="283" y1="304" x2="283" y2="263" stroke="#2563EB" stroke-width="1.9" marker-end="url(#arr-blue)"/>
  <line x1="389" y1="304" x2="389" y2="263" stroke="#2563EB" stroke-width="1.9" marker-end="url(#arr-blue)"/>
  <line x1="548" y1="304" x2="548" y2="263" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ================= 1. UPDATE GATE z_t ================= -->
  <rect x="253.0" y="226.0" width="46" height="32" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="276.0" y="247.6" text-anchor="middle" style="font-size:16px; font-weight:700;" fill="#B45309">σ</text>
  <line x1="276" y1="226" x2="276" y2="148" stroke="#D97706" stroke-width="2.2"/>
  <text x="264" y="206" text-anchor="end" class="math-sm" fill="#B45309">z<tspan dy="3" class="sub-sm">t</tspan></text>

  <!-- Split at (x_z, y_mid) -> right to (x_cand, y_mid) -->
  <circle cx="276" cy="178" r="4" fill="#D97706"/>
  <line x1="280" y1="178" x2="529" y2="178" stroke="#D97706" stroke-width="2.2" marker-end="url(#arr-amber)"/>

  <!-- 1 - z_t pill -> highway x -->
  <rect x="253.0" y="124.0" width="46" height="24" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="276.0" y="139.7" text-anchor="middle" style="font-size:10.5px; font-weight:700;" fill="#B45309">1−z</text>
  <line x1="276" y1="124" x2="276" y2="107" stroke="#D97706" stroke-width="2.2" marker-end="url(#arr-amber)"/>

  <!-- ================= 2. RESET GATE r_t ================= -->
  <rect x="359.0" y="226.0" width="46" height="32" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="382.0" y="247.6" text-anchor="middle" style="font-size:16px; font-weight:700;" fill="#B45309">σ</text>
  <line x1="405" y1="242" x2="435" y2="242" stroke="#D97706" stroke-width="2.2" marker-end="url(#arr-amber)"/>
  <text x="418" y="232" text-anchor="middle" class="math-sm" fill="#B45309">r<tspan dy="3" class="sub-sm">t</tspan></text>

  <!-- r_t * h_(t-1) -> candidate tanh -->
  <circle cx="454" cy="242" r="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.1" filter="url(#shadow)"/>
  <text x="454" y="248" text-anchor="middle" style="font-size:18px; font-weight:700;" fill="#1E293B">×</text>
  <line x1="468" y1="242" x2="515" y2="242" stroke="#7C3AED" stroke-width="2.1" marker-end="url(#arr-purple)"/>

  <!-- ================= 3. CANDIDATE h_tilde_t ================= -->
  <rect x="520.0" y="226.0" width="56" height="32" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="2" filter="url(#shadow)"/>
  <text x="548.0" y="246.4" text-anchor="middle" style="font-size:12.5px; font-weight:700;" fill="#FFFFFF">tanh</text>
  <line x1="548" y1="226" x2="548" y2="197" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-slate)"/>
  <text x="560" y="212" text-anchor="start" class="math-sm" fill="#334155">h̃<tspan dy="3" class="sub-sm">t</tspan></text>

  <!-- ================= FINAL INTERPOLATION OPS ================= -->
  <circle cx="276" cy="88" r="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.1" filter="url(#shadow)"/>
  <text x="276" y="94" text-anchor="middle" style="font-size:18px; font-weight:700;" fill="#1E293B">×</text>
  <circle cx="548" cy="178" r="15" fill="#FFFFFF" stroke="#475569" stroke-width="2.1" filter="url(#shadow)"/>
  <text x="548" y="184" text-anchor="middle" style="font-size:18px; font-weight:700;" fill="#1E293B">×</text>
  <line x1="548" y1="163" x2="548" y2="107" stroke="#7C3AED" stroke-width="2.3" marker-end="url(#arr-purple)"/>
  <circle cx="548" cy="88" r="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.1" filter="url(#shadow)"/>
  <text x="548" y="94" text-anchor="middle" style="font-size:18px; font-weight:700;" fill="#1E293B">+</text>
</svg>
