<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 278" width="960" height="278">

  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .sec-label { font-size: 12.5px; font-weight: 700; fill: #334155; }
      .math { font-size: 16px; font-weight: 700; }
      .math-sm { font-size: 13.5px; font-weight: 700; }
      .sub { font-size: 10.5px; font-weight: 700; }
      .sub-sm { font-size: 9px; font-weight: 700; }
      .tiny { font-size: 10px; fill: #64748B; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="278" fill="#FFFFFF"/>

  <!-- Left: BP (MLP) -->
  <rect x="18" y="16" width="452" height="246" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="36" y="40" class="sec-label">BP (MLP — pesos independentes)</text>

  <rect x="37.0" y="105.0" width="42" height="34" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="58.0" y="126.9" text-anchor="middle" style="font-size:14px; font-weight:700;" fill="#1D4ED8">x</text>
  <rect x="126.0" y="105.0" width="52" height="34" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.0" y="126.9" text-anchor="middle" style="font-size:14px; font-weight:700;" fill="#5B21B6">h<tspan dy="-4" style="font-size:8.5px;">(1)</tspan></text>
  <rect x="220.0" y="105.0" width="52" height="34" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="246.0" y="126.9" text-anchor="middle" style="font-size:14px; font-weight:700;" fill="#5B21B6">h<tspan dy="-4" style="font-size:8.5px;">(2)</tspan></text>
  <rect x="318.0" y="105.0" width="44" height="34" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0" y="126.9" text-anchor="middle" style="font-size:14px; font-weight:700;" fill="#047857">y</text>
  <rect x="400.0" y="105.0" width="48" height="34" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.0" y="126.9" text-anchor="middle" style="font-size:14px; font-weight:700;" fill="#B91C1C">L</text>

  <!-- Forward + W1, W2, W3 -->
  <line x1="79" y1="116" x2="121" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
  <rect x="85" y="94" width="32" height="17" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="101" y="105.5" text-anchor="middle" style="font-size:9.5px; font-weight:700; fill:#B45309;">W<tspan dy="2" style="font-size:7.5px;">1</tspan></text>

  <line x1="178" y1="116" x2="215" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
  <rect x="182" y="94" width="32" height="17" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="198" y="105.5" text-anchor="middle" style="font-size:9.5px; font-weight:700; fill:#B45309;">W<tspan dy="2" style="font-size:7.5px;">2</tspan></text>

  <line x1="272" y1="116" x2="313" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
  <rect x="278" y="94" width="32" height="17" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="294" y="105.5" text-anchor="middle" style="font-size:9.5px; font-weight:700; fill:#B45309;">W<tspan dy="2" style="font-size:7.5px;">3</tspan></text>

  <line x1="362" y1="116" x2="395" y2="116" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Backward -->
  <line x1="400" y1="129" x2="367" y2="129" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <line x1="318" y1="129" x2="277" y2="129" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <line x1="220" y1="129" x2="183" y2="129" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <line x1="126" y1="129" x2="84" y2="129" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>

  <!-- Separate gradient boxes -->
  <line x1="101" y1="136" x2="101" y2="198" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>
  <line x1="198" y1="136" x2="198" y2="198" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>
  <line x1="294" y1="136" x2="294" y2="198" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>
  <rect x="67.0" y="207.0" width="68" height="30" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2" filter="url(#shadow)"/>
  <text x="101.0" y="226.2" text-anchor="middle" style="font-size:12px; font-weight:700;" fill="#B91C1C">∇W<tspan dy="2" style="font-size:8px;">1</tspan></text>
  <rect x="164.0" y="207.0" width="68" height="30" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2" filter="url(#shadow)"/>
  <text x="198.0" y="226.2" text-anchor="middle" style="font-size:12px; font-weight:700;" fill="#B91C1C">∇W<tspan dy="2" style="font-size:8px;">2</tspan></text>
  <rect x="260.0" y="207.0" width="68" height="30" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2" filter="url(#shadow)"/>
  <text x="294.0" y="226.2" text-anchor="middle" style="font-size:12px; font-weight:700;" fill="#B91C1C">∇W<tspan dy="2" style="font-size:8px;">3</tspan></text>

  <!-- Right: BPTT (RNN) -->
  <rect x="490" y="16" width="452" height="246" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="508" y="40" class="sec-label">BPTT (RNN — pesos compartilhados no tempo)</text>

  <rect x="545.0" y="170.0" width="42" height="24" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="566.0" y="186.0" text-anchor="middle" style="font-size:11.5px; font-weight:700;" fill="#1D4ED8">x<tspan dy="2.5" style="font-size:8.5px;">1</tspan></text>  <line x1="566" y1="170" x2="566" y2="154" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arr-blue)"/>  <rect x="540.0" y="117.0" width="52" height="34" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="566.0" y="138.9" text-anchor="middle" style="font-size:14px; font-weight:700;" fill="#5B21B6">h<tspan dy="3" class="sub-sm">1</tspan></text>  <line x1="559" y1="117" x2="559" y2="92" stroke="#059669" stroke-width="1.9" marker-end="url(#arr-green)"/>  <line x1="574" y1="89" x2="574" y2="114" stroke="#DC2626" stroke-width="2.1" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>  <rect x="529.0" y="63.0" width="74" height="26" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="566.0" y="80.0" text-anchor="middle" style="font-size:11.5px; font-weight:700;" fill="#B91C1C"><tspan fill="#047857">y</tspan><tspan dy="2" style="font-size:8px;" fill="#047857">1</tspan><tspan dy="-2" fill="#64748B">→</tspan><tspan fill="#B91C1C">L</tspan><tspan dy="2" style="font-size:8px;" fill="#B91C1C">1</tspan></text>  <line x1="592" y1="128" x2="681" y2="128" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arr-purple)"/>  <rect x="618.0" y="107" width="42" height="17" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>  <text x="639.0" y="118.5" text-anchor="middle" style="font-size:9.5px; font-weight:700; fill:#B45309;">W<tspan dy="2" style="font-size:7.5px;">hh</tspan></text>  <line x1="686" y1="141" x2="597" y2="141" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>  <rect x="691.0" y="170.0" width="42" height="24" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="712.0" y="186.0" text-anchor="middle" style="font-size:11.5px; font-weight:700;" fill="#1D4ED8">x<tspan dy="2.5" style="font-size:8.5px;">2</tspan></text>  <line x1="712" y1="170" x2="712" y2="154" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arr-blue)"/>  <rect x="686.0" y="117.0" width="52" height="34" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="712.0" y="138.9" text-anchor="middle" style="font-size:14px; font-weight:700;" fill="#5B21B6">h<tspan dy="3" class="sub-sm">2</tspan></text>  <line x1="705" y1="117" x2="705" y2="92" stroke="#059669" stroke-width="1.9" marker-end="url(#arr-green)"/>  <line x1="720" y1="89" x2="720" y2="114" stroke="#DC2626" stroke-width="2.1" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>  <rect x="675.0" y="63.0" width="74" height="26" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="712.0" y="80.0" text-anchor="middle" style="font-size:11.5px; font-weight:700;" fill="#B91C1C"><tspan fill="#047857">y</tspan><tspan dy="2" style="font-size:8px;" fill="#047857">2</tspan><tspan dy="-2" fill="#64748B">→</tspan><tspan fill="#B91C1C">L</tspan><tspan dy="2" style="font-size:8px;" fill="#B91C1C">2</tspan></text>  <line x1="738" y1="128" x2="827" y2="128" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arr-purple)"/>  <rect x="764.0" y="107" width="42" height="17" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>  <text x="785.0" y="118.5" text-anchor="middle" style="font-size:9.5px; font-weight:700; fill:#B45309;">W<tspan dy="2" style="font-size:7.5px;">hh</tspan></text>  <line x1="832" y1="141" x2="743" y2="141" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>  <rect x="837.0" y="170.0" width="42" height="24" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="858.0" y="186.0" text-anchor="middle" style="font-size:11.5px; font-weight:700;" fill="#1D4ED8">x<tspan dy="2.5" style="font-size:8.5px;">3</tspan></text>  <line x1="858" y1="170" x2="858" y2="154" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arr-blue)"/>  <rect x="832.0" y="117.0" width="52" height="34" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="858.0" y="138.9" text-anchor="middle" style="font-size:14px; font-weight:700;" fill="#5B21B6">h<tspan dy="3" class="sub-sm">3</tspan></text>  <line x1="851" y1="117" x2="851" y2="92" stroke="#059669" stroke-width="1.9" marker-end="url(#arr-green)"/>  <line x1="866" y1="89" x2="866" y2="114" stroke="#DC2626" stroke-width="2.1" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>  <rect x="821.0" y="63.0" width="74" height="26" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="858.0" y="80.0" text-anchor="middle" style="font-size:11.5px; font-weight:700;" fill="#B91C1C"><tspan fill="#047857">y</tspan><tspan dy="2" style="font-size:8px;" fill="#047857">3</tspan><tspan dy="-2" fill="#64748B">→</tspan><tspan fill="#B91C1C">L</tspan><tspan dy="2" style="font-size:8px;" fill="#B91C1C">3</tspan></text>

  <!-- Gradient sum box -->
  <rect x="556" y="210" width="312" height="34" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="712" y="231" text-anchor="middle" style="font-size:11.5px; font-weight:700; fill:#991B1B;">∇W<tspan dy="2.5" style="font-size:8.5px;">hh</tspan><tspan dy="-2.5"> = (∇W</tspan><tspan dy="2.5" style="font-size:8.5px;">hh</tspan><tspan dy="-2.5">)</tspan><tspan dy="2.5" style="font-size:8px;">t=1</tspan><tspan dy="-2.5"> + (∇W</tspan><tspan dy="2.5" style="font-size:8.5px;">hh</tspan><tspan dy="-2.5">)</tspan><tspan dy="2.5" style="font-size:8px;">t=2</tspan><tspan dy="-2.5"> + (∇W</tspan><tspan dy="2.5" style="font-size:8.5px;">hh</tspan><tspan dy="-2.5">)</tspan><tspan dy="2.5" style="font-size:8px;">t=3</tspan></text>
</svg>
